services:
  postgres:
    image: postgres:16-alpine
    container_name: lms-postgres-dev
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: lms-backend-dev
    env_file:
      - .env
    environment:
      NODE_ENV: development
      BACKEND_PORT: ${BACKEND_PORT}
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      CORS_ORIGINS: ${CORS_ORIGINS}
      STORAGE_DRIVER: ${STORAGE_DRIVER}
      STORAGE_LOCAL_ROOT: ${STORAGE_LOCAL_ROOT}
      MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES}
      STREAM_URL_TTL_SECONDS: ${STREAM_URL_TTL_SECONDS:-3600}
      THROTTLE_TTL_SECONDS: ${THROTTLE_TTL_SECONDS}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT}
      MASTER_SEED_EMAIL: ${MASTER_SEED_EMAIL}
      MASTER_SEED_PASSWORD: ${MASTER_SEED_PASSWORD}
    ports:
      # Host port is separate because macOS AirPlay Receiver squats on 5000.
      - "${BACKEND_HOST_PORT:-5000}:${BACKEND_PORT}"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./backend/package.json:/app/package.json:ro
      - ./backend/package-lock.json:/app/package-lock.json:ro
      - ./backend/tsconfig.json:/app/tsconfig.json:ro
      - ./backend/tsconfig.build.json:/app/tsconfig.build.json:ro
      - ./backend/nest-cli.json:/app/nest-cli.json:ro
      - backend_node_modules:/app/node_modules
      - backend_storage_dev:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lms_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: lms-frontend-dev
    environment:
      NODE_ENV: development
      HOSTNAME: 0.0.0.0
      PORT: ${FRONTEND_PORT}
      INTERNAL_API_URL: http://backend:${BACKEND_PORT}
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-true}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    depends_on:
      - backend
    networks:
      - lms_network

  caddy:
    image: caddy:2-alpine
    container_name: lms-caddy-dev
    environment:
      # Plain HTTP locally; production sets SITE_ADDRESS to the real domain.
      SITE_ADDRESS: ":80"
      FRONTEND_PORT: ${FRONTEND_PORT}
      BACKEND_PORT: ${BACKEND_PORT}
    ports:
      - "${PROXY_PORT:-8080}:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - frontend
      - backend
    networks:
      - lms_network

volumes:
  postgres_data_dev:
  backend_node_modules:
  backend_storage_dev:
  frontend_node_modules:
  frontend_next_cache:

networks:
  lms_network:
    driver: bridge
