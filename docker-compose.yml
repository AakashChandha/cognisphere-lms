# Production stack. One Lightsail instance runs exactly this file.
# See PROD_DEPLOYMENT.md (first-time setup) and OPERATIONS.md (day to day).

services:
  postgres:
    image: postgres:16-alpine
    container_name: lms-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # No `ports:` on purpose. Postgres is reachable only from other
    # containers on lms_network; publishing it would expose it to the
    # internet (Docker bypasses the host firewall).
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms_network

  # One-off migration runner. Uses the `deps` build stage (full node_modules
  # + Prisma CLI + schema, no compiled app) purely to apply committed
  # migrations and seed baseline data (roles + master account; demo data is
  # skipped because NODE_ENV=production) before the API starts accepting
  # traffic. Exits after completion; `backend` waits for it to succeed.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      target: deps
    container_name: lms-migrate
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      MASTER_SEED_EMAIL: ${MASTER_SEED_EMAIL}
      MASTER_SEED_PASSWORD: ${MASTER_SEED_PASSWORD}
    command: ["sh", "-c", "npx prisma migrate deploy && npx prisma db seed"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lms_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: lms-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      BACKEND_PORT: ${BACKEND_PORT}
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      CORS_ORIGINS: ${CORS_ORIGINS}
      STORAGE_DRIVER: ${STORAGE_DRIVER}
      STORAGE_LOCAL_ROOT: ${STORAGE_LOCAL_ROOT}
      MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES}
      STREAM_URL_TTL_SECONDS: ${STREAM_URL_TTL_SECONDS:-3600}
      THROTTLE_TTL_SECONDS: ${THROTTLE_TTL_SECONDS}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT}
      MASTER_SEED_EMAIL: ${MASTER_SEED_EMAIL}
      MASTER_SEED_PASSWORD: ${MASTER_SEED_PASSWORD}
    expose:
      - "${BACKEND_PORT}"
    volumes:
      - backend_storage:/app/storage
    healthcheck:
      # /api/health also checks the database, so "healthy" means "can serve".
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${BACKEND_PORT:-5000}/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - lms_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: lms-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: ${FRONTEND_PORT}
      INTERNAL_API_URL: http://backend:${BACKEND_PORT}
    expose:
      - "${FRONTEND_PORT}"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - lms_network

  caddy:
    image: caddy:2-alpine
    container_name: lms-caddy
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      FRONTEND_PORT: ${FRONTEND_PORT}
      BACKEND_PORT: ${BACKEND_PORT}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # TLS certificates and ACME account live here. Never delete this
      # volume casually: Let's Encrypt rate-limits re-issuance.
      - caddy_data:/data
      - caddy_config:/config
    # Intentionally no depends_on: Caddy must stay up while the app restarts.
    networks:
      - lms_network

volumes:
  postgres_data:
  backend_storage:
  caddy_data:
  caddy_config:

networks:
  lms_network:
    driver: bridge
